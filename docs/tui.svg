<text x="39.4" y="26.5" fill="#d0d0d0" xml:space="preserve">the runner test is flaky under -count=20; make it deterministic and explain the race             </text>
<text x="23.8" y="60.5" fill="#6c6c6c" font-style="italic" xml:space="preserve">The failure is a wait on the process group racing the reaper; reading the runner first.</text>
<text x="23.8" y="77.5" fill="#5fafaf" xml:space="preserve">│ </text>
<text x="39.4" y="77.5" fill="#d0d0d0" font-weight="600" xml:space="preserve">read</text>
<text x="70.6" y="77.5" fill="#8a8a8a" xml:space="preserve"> internal/execution/runner_test.go</text>
<text x="23.8" y="94.5" fill="#5fafaf" xml:space="preserve">└ </text>
<text x="39.4" y="94.5" fill="#00d787" xml:space="preserve">✓</text>
<text x="47.2" y="94.5" fill="#8a8a8a" xml:space="preserve"> 12ms</text>
