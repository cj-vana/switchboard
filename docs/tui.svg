<text x="47.2" y="315.5" fill="#8a8a8a" xml:space="preserve"> 40ms · 1 replacement</text>
<text x="23.8" y="349.5" fill="#d0d0d0" xml:space="preserve">The race: </text>
<text x="101.8" y="349.5" fill="#ff5f5f" xml:space="preserve"> Wait </text>
<text x="148.6" y="349.5" fill="#d0d0d0" xml:space="preserve"> returns when the direct child exits, but the kill walks the process group        </text>
<text x="23.8" y="366.5" fill="#d0d0d0" xml:space="preserve">afterwards, so a grandchild can outlive the assertion.                                            </text>
<text x="23.8" y="400.5" fill="#d0d0d0" xml:space="preserve">• </text>
