name: release

# Cutting a tag is cutting a release: v* builds every supported platform,
# packages each as sb_<version>_<os>_<arch>.tar.gz next to a checksums.txt, and
# publishes them. install.sh and /update both consume exactly this layout.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./... && go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and package
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          mkdir -p dist
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64 windows_arm64; do
            os="${target%_*}"
            arch="${target#*_}"
            bin="sb"
            if [ "$os" = windows ]; then bin="sb.exe"; fi
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$tag" -o "dist/$bin" ./cmd/sb
            (cd dist && tar -czf "sb_${ver}_${os}_${arch}.tar.gz" "$bin" && rm "$bin")
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
