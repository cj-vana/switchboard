# Switchboard bundled target catalog.
#
# This file is vendored at build time so the tool works offline and on first
# run. It is data, not code: a correction here does not need a binary release.
#
# Every price below was read from a primary source on the date in its
# `verified_at` field. Provider documentation is versioned by editing in place,
# so these URLs will keep resolving and will stop describing what was read.
# Assume drift rather than agreement, and re-verify before trusting a number
# for anything that matters.
#
# Known simplification: Claude Sonnet 5 carries an introductory rate of
# $2/$10 per MTok through 2026-08-31, which is not modelled here because a
# price band has a start date but no expiry. Estimates for that model are
# therefore high until the introductory period ends. Over-estimating is the
# safe direction for a budget, which enforces against worst-reasonable cost.

revision = "2026-08-13"

# --------------------------------------------------------------------------
# Local models.
#
# Ollama serves whatever the user has pulled, so the catalog cannot enumerate
# them. This default carries what holds for everything on the surface and the
# probe fills in the rest.
# --------------------------------------------------------------------------

[[surface_default]]
provider = "ollama"
surface = "local"
metering = "local"
display_name = "local model"
context_window = 0        # unknown until probed
max_output = 0
tools = "parallel"
vision = false
reasoning = "adaptive"
effort_levels = ["low", "medium", "high", "max"]
verified_at = 2026-08-13T00:00:00Z
source_urls = ["https://github.com/ollama/ollama/blob/main/docs/api.md"]

  # Running locally costs no money. It also costs the router its evidence:
  # Ollama reuses its KV cache across requests and reports nothing about it,
  # so a target on this surface cannot exercise the section 6 cache economics
  # no matter how the prefix is arranged.
  [[surface_default.pricing]]
  effective_at = 2026-08-13T00:00:00Z
  input_per_mtok = "0"
  output_per_mtok = "0"
  cache_read_per_mtok = "0"

  [surface_default.cache]
  modes = ["none"]
  default_mode = "none"
  min_tokens = 0
  max_breakpoints = 0
  lookback_blocks = 0
  routing_key_support = false
  usage_accounting = "none"

# --------------------------------------------------------------------------
# The same local models, reached through Ollama's OpenAI-compatible endpoint.
#
# This is a second surface for models the surface above already serves, and it
# is deliberately its own catalog entry rather than an alias. The format
# discards things the native API carries, so the two are not interchangeable and
# a target on one is not a target on the other.
#
# What the compatibility format costs, measured against a recorded capture of
# this exact endpoint rather than against the format's documentation:
#
#   - Tool arguments arrive as an escaped JSON string assembled from fragments,
#     so a call is only known to be well formed once the choice finishes.
#   - Reasoning has no agreed field name; this server sends "reasoning" and
#     others send "reasoning_content".
#   - Per-model capabilities are not reported at all. The native surface probes
#     them; here they come from the profile, which is a claim about the server
#     rather than an observation of the model.
# --------------------------------------------------------------------------

[[surface_default]]
provider = "openaicompat"
surface = "ollama"
metering = "local"
display_name = "local model (OpenAI-compatible endpoint)"
context_window = 0        # the format reports nothing; unknown means unknown
max_output = 0
tools = "parallel"
vision = false
reasoning = "adaptive"
effort_levels = ["low", "medium", "high", "max"]
verified_at = 2026-08-13T00:00:00Z
source_urls = ["https://github.com/ollama/ollama/blob/main/docs/openai.md"]

  [[surface_default.pricing]]
  effective_at = 2026-08-13T00:00:00Z
  input_per_mtok = "0"
  output_per_mtok = "0"
  cache_read_per_mtok = "0"

  # The format has a place to report cached prompt tokens, under
  # prompt_tokens_details.cached_tokens, and this server never populates it.
  # The adapter reads the field because a paid server will send it; the catalog
  # records that here it stays absent, so no cache accounting can be claimed.
  [surface_default.cache]
  modes = ["none"]
  default_mode = "none"
  min_tokens = 0
  max_breakpoints = 0
  lookback_blocks = 0
  routing_key_support = false
  usage_accounting = "none"

# --------------------------------------------------------------------------
# OpenAI, reached through a ChatGPT plan.
#
# The per-token rates are zero because this surface is not billed per token: a
# flat subscription pays for it. That is not the same claim as "free", and the
# difference matters to a router. A local model is free because nothing meters
# it; this is metered by rate limits and plan entitlements rather than by
# dollars, so the scarce resource is quota rather than budget. Nothing here
# models quota yet, so a cost estimate against this target is correct at zero
# and silent about the thing that actually runs out.
#
# The cache mechanics are real and are the reason this entry exists. The
# endpoint reports cached and written prompt tokens separately, and it accepts
# a caller-supplied routing key, which no other target here does.
# --------------------------------------------------------------------------

[[surface_default]]
provider = "openai"
surface = "subscription"
metering = "plan"
display_name = "ChatGPT plan model"
context_window = 0        # not reported by the discovery endpoint
max_output = 0
tools = "parallel"
vision = true
reasoning = "effort"
effort_levels = ["low", "medium", "high"]
verified_at = 2026-08-13T00:00:00Z
source_urls = ["https://chatgpt.com/backend-api/codex/models"]

  [[surface_default.pricing]]
  effective_at = 2026-08-13T00:00:00Z
  input_per_mtok = "0"
  output_per_mtok = "0"
  cache_read_per_mtok = "0"

  [surface_default.cache]
  modes = ["automatic"]
  default_mode = "automatic"
  min_tokens = 0
  max_breakpoints = 0
  lookback_blocks = 0
  routing_key_support = true
  usage_accounting = "separate"

# --------------------------------------------------------------------------
# Moonshot's Kimi Code plan.
#
# Serves the Messages API, so the Anthropic adapter drives it. What was
# confirmed against the endpoint rather than assumed: usage reports cache reads
# and writes as counts disjoint from the input total, caching happens without
# any marker being sent, and thinking blocks arrive with signatures.
#
# The per-token rates are zero because this endpoint is the coding plan, which
# is billed as a subscription rather than per token. That is the one field here
# not established from the API: the endpoint reports usage but says nothing
# about money, and Moonshot also sells a pay-as-you-go API at another host under
# a different key. If this key is metered per token, these numbers are wrong in
# the direction that under-reports, and the entry needs correcting before any
# budget is trusted against it.
# --------------------------------------------------------------------------

[[surface_default]]
provider = "kimi"
surface = "coding"
metering = "plan"
display_name = "Kimi Code"
context_window = 262144
max_output = 0
tools = "parallel"
vision = true
reasoning = "adaptive"
effort_levels = []
verified_at = 2026-08-13T00:00:00Z
source_urls = ["https://api.kimi.com/coding/v1/models"]

  [[surface_default.pricing]]
  effective_at = 2026-08-13T00:00:00Z
  input_per_mtok = "0"
  output_per_mtok = "0"
  cache_read_per_mtok = "0"

  # Automatic: a read was observed on a second turn with no cache_control sent,
  # so the server decides what to keep and a breakpoint manager has nothing to
  # place here.
  [surface_default.cache]
  modes = ["automatic"]
  default_mode = "automatic"
  min_tokens = 0
  max_breakpoints = 0
  lookback_blocks = 0
  routing_key_support = false
  usage_accounting = "separate"

# --------------------------------------------------------------------------
# Anthropic, first-party API.
#
# No adapter binds these yet; they are here so the pricing and cache mechanics
# the router needs are data rather than something to invent later. The
# minimum cacheable prefix is the field most worth reading twice: it is not
# monotonic across generations, so a 3,000-token prefix caches on Opus 5 and
# silently does not on Haiku 4.5, with no error in either direction.
# --------------------------------------------------------------------------

[[model]]
provider = "anthropic"
surface = "first-party"
provider_model_id = "claude-opus-5"
display_name = "Claude Opus 5"
context_window = 1000000
max_output = 128000
tools = "parallel"
strict_schema = true
vision = true
reasoning = "adaptive"
effort_levels = ["low", "medium", "high", "xhigh", "max"]
structured_out = true
verified_at = 2026-08-13T00:00:00Z
source_urls = ["https://platform.claude.com/docs/en/about-claude/models/overview"]

  [[model.pricing]]
  effective_at = 2026-08-13T00:00:00Z
  input_per_mtok = "5.00"
  output_per_mtok = "25.00"
  cache_read_per_mtok = "0.50"
  cache_write_per_mtok = { "5m" = "6.25", "1h" = "10.00" }

  [model.cache]
  modes = ["explicit"]
  default_mode = "explicit"
  min_tokens = 512
  ttls = ["5m", "1h"]
  max_breakpoints = 4
  lookback_blocks = 20
  routing_key_support = false
  usage_accounting = "separate"

